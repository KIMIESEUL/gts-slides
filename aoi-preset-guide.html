<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AOI PRESETTING GUIDE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#f3f4f6;--panel:#ffffff;--card:#f8fafc;--card-border:#e2e8f0;
  --accent:#2563eb;--accent-light:#eff6ff;--text:#1e293b;--text-sec:#64748b;
  --text-muted:#94a3b8;--badge1:#ef4444;--badge2:#f59e0b;--badge3:#22c55e;
  --arrow:#2563eb;--divider:#e2e8f0;--clear-btn:#cbd5e1;--clear-hover:#a8b5c5;
  --crm-text:#dc2626;--check-fg:#2563eb;
}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;}
.main{display:flex;gap:10px;padding:10px;height:100vh;}
.left-panel{width:350px;min-width:320px;background:var(--panel);border-radius:10px;border:1px solid var(--card-border);display:flex;flex-direction:column;overflow:hidden;}
.right-panel{flex:1;background:var(--panel);border-radius:10px;border:1px solid var(--card-border);display:flex;flex-direction:column;overflow:hidden;}
.panel-title{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 0;}
.panel-title h3{font-size:14px;font-weight:700;}
.sel-count{font-size:11px;color:var(--accent);}
.divider{height:1px;background:var(--divider);margin:6px 12px 0;}
.part-row{display:flex;align-items:center;gap:8px;padding:8px 20px 0 20px;}
.part-row label{font-size:12px;font-weight:700;white-space:nowrap;}
.part-select{flex:1;height:28px;border:1px solid var(--card-border);border-radius:0;background:var(--card);font-size:12px;font-family:inherit;color:var(--text);padding:0 8px;cursor:pointer;appearance:auto;}
.symptom-scroll{flex:1;overflow-y:auto;padding:4px 6px;}
.symptom-scroll::-webkit-scrollbar{width:6px;}
.symptom-scroll::-webkit-scrollbar-track{background:transparent;}
.symptom-scroll::-webkit-scrollbar-thumb{background:var(--clear-btn);border-radius:3px;}
.cat-pair{display:grid;grid-template-columns:1fr 1fr;gap:0 0;padding:4px 0;}
.cat-col{padding:0 2px;}
.cat-label{font-size:12px;font-weight:700;color:var(--accent);padding:4px 8px 2px;}
.sym-row{display:flex;align-items:center;gap:4px;padding:1px 8px;}
.sym-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--check-fg);cursor:pointer;margin:0;}
.sym-row span{font-size:12px;cursor:pointer;user-select:none;}
.bottom-bar{padding:2px 12px 8px;display:flex;justify-content:flex-end;}
.btn-clear{background:var(--clear-btn);color:var(--text-sec);border:none;border-radius:5px;padding:4px 12px;font-size:12px;font-family:inherit;cursor:pointer;}
.btn-clear:hover{background:var(--clear-hover);}
.tabs{display:flex;padding:8px 8px 0;gap:0;justify-content:center;}
.tab-wrap{display:inline-flex;background:var(--card-border);border-radius:6px;overflow:hidden;}
.tab-btn{padding:5px 18px;text-align:center;font-size:12px;font-weight:600;border:none;cursor:pointer;font-family:inherit;transition:background .15s,color .15s;border-radius:0;}
.tab-btn.active{background:var(--accent);color:#fff;}
.tab-btn:not(.active){background:var(--card-border);color:var(--text);}
.tab-btn:not(.active):hover{background:var(--clear-btn);}
.tab-content{flex:1;overflow-y:auto;padding:0 4px 4px;}
.tab-content::-webkit-scrollbar{width:6px;}
.tab-content::-webkit-scrollbar-track{background:transparent;}
.tab-content::-webkit-scrollbar-thumb{background:var(--clear-btn);border-radius:3px;}
.result-header{display:flex;align-items:center;padding:4px 8px;}
.result-count{font-size:11px;color:var(--text-muted);}
.empty-msg{text-align:center;color:var(--text-muted);font-size:14px;padding:60px 0;}
.rule-card{background:var(--card);border-radius:8px;border:1px solid var(--card-border);margin:3px 4px;padding:0;}
.rule-top{display:flex;align-items:center;padding:8px 12px 3px;}
.badge{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:8px;padding:1px 8px;margin-right:8px;min-width:28px;text-align:center;}
.badge-1{background:var(--badge1);}
.badge-2{background:var(--badge2);}
.badge-3{background:var(--badge3);}
.rule-name{font-size:13px;font-weight:700;flex:1;}
.btn-apply{background:var(--accent);color:#fff;border:none;border-radius:5px;padding:3px 14px;font-size:11px;font-family:inherit;cursor:pointer;white-space:nowrap;}
.btn-apply:hover{background:#1d4ed8;}
.rule-desc{font-size:12px;color:var(--text-sec);padding:0 12px 4px;line-height:1.4;}
.rule-desc.crm{color:var(--crm-text);}
.change-box{background:var(--accent-light);border-radius:5px;margin:0 12px 8px;padding:2px 0;}
.change-row{display:flex;align-items:center;padding:2px 10px;gap:4px;font-size:12px;}
.change-row .key{width:220px;min-width:180px;color:var(--text);}
.change-row .default-val{color:var(--text-muted);}
.change-row .arrow{color:var(--arrow);font-weight:700;font-size:11px;margin:0 4px;}
.change-row .new-val{color:var(--accent);font-weight:700;}
.guide-card{background:var(--card);border-radius:8px;border:1px solid var(--card-border);margin:2px 8px;padding:6px 10px;}
.guide-card h4{font-size:14px;font-weight:700;color:var(--text);}
.guide-card .guide-desc{font-size:12px;color:var(--text-sec);margin:0 0 2px;line-height:1.4;}
.guide-opts{background:var(--accent-light);border-radius:5px;padding:4px 0;margin-top:4px;}
.guide-opt{display:flex;padding:5px 8px;gap:8px;}
.guide-opt .opt-name{min-width:200px;width:200px;font-size:13px;color:var(--accent);flex-shrink:0;}
.guide-opt .opt-desc{font-size:12px;color:var(--text);line-height:1.4;}
.guide-cat-title{font-size:15px;font-weight:700;color:var(--accent);padding:8px 8px 4px;}
.overview-card{background:var(--card);border-radius:8px;border:1px solid var(--card-border);margin:4px 8px 8px;padding:8px 10px;}
.overview-card h4{font-size:15px;font-weight:700;color:var(--accent);margin-bottom:2px;}
.overview-card .ov-desc{font-size:12px;color:var(--text-sec);line-height:1.4;margin-bottom:6px;}
.ov-table{background:var(--accent-light);border-radius:5px;padding:4px 0;}
.ov-table table{width:100%;border-collapse:collapse;font-size:12px;}
.ov-table th{font-size:11px;font-weight:700;color:var(--text-muted);text-align:left;padding:4px 10px;border-bottom:1px solid var(--card-border);}
.ov-table td{padding:4px 10px;vertical-align:top;}
.ov-table .cat-cell{font-weight:400;color:var(--accent);white-space:nowrap;}
.ov-table .role-cell{color:var(--text);}
.ov-table .params-cell{color:var(--text-sec);}
</style>
</head>
<body>
<div class="main">
  <div class="left-panel">
    <div class="panel-title">
      <h3>증상 선택</h3>
      <span class="sel-count" id="selCount"></span>
    </div>
    <div class="divider"></div>
    <div class="part-row">
      <label>파트 타입 :</label>
      <select class="part-select" id="partSelect"></select>
    </div>
    <div class="divider"></div>
    <div class="symptom-scroll" id="symptomArea"></div>
    <div class="bottom-bar">
      <button class="btn-clear" id="btnClear">전체 해제</button>
    </div>
  </div>
  <div class="right-panel">
    <div class="tabs">
      <div class="tab-wrap">
        <button class="tab-btn active" data-tab="combo">추천 조합</button>
        <button class="tab-btn" data-tab="guide">파라미터 가이드</button>
      </div>
    </div>
    <div class="tab-content" id="tabCombo">
      <div class="result-header"><span class="result-count" id="resultCount"></span></div>
      <div id="resultArea"><div class="empty-msg">증상을 선택하세요</div></div>
    </div>
    <div class="tab-content" id="tabGuide" style="display:none;"></div>
  </div>
</div>
<script>
const SYMPTOM_CATEGORIES = {
  "3D 형상": ["3D 무너짐","높이 부족","높이 과다","베이스 불안정","Lead 높이 이상"],
  "노이즈": ["Body 노이즈","Lead 노이즈","밝은 영역 포화(노이즈)","어두운 영역 노이즈","Body 홀 노이즈"],
  "위치/검출": ["Body 위치 못 잡음","Body 크기 안 맞음","Tombstone 오검","Pad 검출 이상"],
  "부품 특징": ["Mirror/반사 표면","투명/반투명 다이","흰색 부품","검은 바디 + 플럭스","반짝이는 커넥터/금속면"],
  "기판/환경": ["FPCB 휨(Warp)","밀집 부품 배치","오클루전(쉴드 캔)","높은 부품 옆 간섭"],
  "기타": ["Hotbar 부품","큰 부품 (BGA/QFP)","사이클 타임 개선","PCB 홀 노이즈","SW 업그레이드 후 3D 이상"]
};

const PART_TYPES = [
  ["선택 안 함",[]],
  ["Chip (소형 수동소자)",["Tombstone 오검","높이 부족"]],
  ["IC (Lead형 - QFP/SOP)",["Lead 높이 이상","Lead 노이즈","큰 부품 (BGA/QFP)"]],
  ["BGA/CSP",["큰 부품 (BGA/QFP)","3D 무너짐","베이스 불안정"]],
  ["QFN/DFN (무리드)",["Pad 검출 이상","높이 부족"]],
  ["Connector",["높은 부품 옆 간섭","반짝이는 커넥터/금속면"]],
  ["LED/다이오드",["투명/반투명 다이","흰색 부품"]],
  ["전해 캐패시터",["높은 부품 옆 간섭","3D 무너짐"]],
  ["이형 부품 (Odd Shape)",["Body 크기 안 맞음","Body 위치 못 잡음"]],
  ["Shield Can",["오클루전(쉴드 캔)"]]
];

const DEFAULTS = {
  "Body Location Mode":"Full 3D (Adaptive Hei. Ths.)","Body Fitting by":"Fit Rectangle",
  "Warp Compensation":"Not Use","Search Mode":"Auto","Base Height Value":"CAD",
  "Location Restraint Mode":"None","Noise Reduction":"Off (Normal)","Body Inspection":"On",
  "Extra Body Location Mode":"No Extra Location","Body Offset for Odd Shape":"Not Use",
  "Pad Detection":"Off","Occlusion Component Check":"Not Use",
  "Z-Axis Move for Additional 2D Image":"Not Use","Lead Base Align Mode":"Off",
  "Base ROI Expansion Mode":"Auto","Base Setting":"Basic",
  "Base Slope Compensation Mode":"Not Use","Base ROI Alignment Mode":"Normal",
  "Processing Speed":"x1","Measure Range(%)":"90.0","Higher Measurement":"Not Use",
  "3D Projection Switches":"Hide","Filtering":"Not Use",
  "3D Reconstruction in FOV":"Not Use (Component ROI)","Bright Threshold(Gray)":"230",
  "Dark Threshold(Gray)":"5","Amplitude Threshold(0-255)":"1",
  "Visibility Threshold(0-1.0)":"0.1","3D Noise of Lead":"Level 0 (Normal)",
  "Mode of Flux on Black Body":"Off","Shadow Check":"Normal","White Component":"No",
  "2D/3D Noise of Body":"No","AI Denoising":"Off","Hole Noise Removal":"Off",
  "Shape based Noise Filter":"Off","Solder Joint 3D Mode":"Normal",
  "Lead Area Reconstruction":"Off","Left(um)":"100","Top(um)":"100","Right(um)":"100","Bottom(um)":"100"
};

const RULES = [
  {symptoms:["Tombstone 오검","높이 부족"],changes:{"Body Location Mode":"Two Terminal Chip","Body Inspection":"On","Higher Measurement":"Use (Higher)"},priority:1,name:"Chip 전용 Two Terminal + Higher",desc:"소형 Chip 부품(0201~1206). Two Terminal Chip 모드로 양단자 전용 검출 + Higher Measurement."},
  {symptoms:["Lead 높이 이상","Lead 노이즈","큰 부품 (BGA/QFP)"],changes:{"Body Location Mode":"Corner 3D (Fixed Hei. Ths.)","Lead Base Align Mode":"Use (Lead Base Align)","3D Noise of Lead":"Level 1","Processing Speed":"x2"},priority:1,name:"IC Lead형 Corner 3D + Lead 정렬",desc:"QFP/SOP 등 Lead형 IC. Corner 3D + Lead Base 정렬로 Lead 높이 정확도 향상."},
  {symptoms:["큰 부품 (BGA/QFP)","3D 무너짐","베이스 불안정"],changes:{"Body Location Mode":"Corner 3D (Fixed Hei. Ths.)","3D Reconstruction in FOV":"Use (FOV)","Processing Speed":"x4","Base Setting":"Manual","Left(um)":"400","Top(um)":"400","Right(um)":"400","Bottom(um)":"400","Base ROI Alignment Mode":"Absolute","AI Denoising":"On"},priority:1,name:"BGA/CSP 종합 대응",desc:"BGA/CSP 대형 패키지. Corner 3D + FOV GPU 재구성 + Manual Base 확장."},
  {symptoms:["Pad 검출 이상","높이 부족"],changes:{"Body Location Mode":"Full 3D (Adaptive Hei. Ths.)","Pad Detection":"On (Pad Detection)","Higher Measurement":"Use (Higher)"},priority:1,name:"QFN/DFN Pad 검출 + Higher",desc:"QFN/DFN 무리드 IC. Pad Detection으로 패드 검출 + Higher Measurement로 낮은 높이 정밀 측정."},
  {symptoms:["높은 부품 옆 간섭","반짝이는 커넥터/금속면"],changes:{"Body Location Mode":"Full 3D (Fixed Hei. Ths.)","3D Projection Switches":"Show (All Ch. On)","Bright Threshold(Gray)":"255","Amplitude Threshold(0-255)":"0","Filtering":"Flat Surface"},priority:1,name:"Connector Fixed Hei. + Projection 확인",desc:"커넥터류. Fixed Hei. Ths.로 높은 부품 안정 검출 + Projection 간섭 채널 확인."},
  {symptoms:["투명/반투명 다이","흰색 부품"],changes:{"Body Location Mode":"Full 3D (Adaptive Hei. Ths.)","White Component":"Yes","Noise Reduction":"On (Using 2D)","Filtering":"Gaussian Blur"},priority:1,name:"LED Adaptive + White + 투명 보정",desc:"LED/다이오드. White Component + 2D 노이즈 리덕션 + Gaussian으로 Fringe 투과 보상."},
  {symptoms:["높은 부품 옆 간섭","3D 무너짐"],changes:{"Body Location Mode":"Full 3D (Fixed Hei. Ths.)","3D Projection Switches":"Show (All Ch. On)","Higher Measurement":"Use (Higher)","AI Denoising":"On"},priority:2,name:"전해캡 Fixed Hei. + Higher",desc:"전해 캐패시터 등 높은 원통형 부품. Fixed Hei. Ths.로 안정 검출 + Higher Measurement."},
  {symptoms:["Body 크기 안 맞음","Body 위치 못 잡음"],changes:{"Body Location Mode":"Odd Shape","Extra Body Location Mode":"Resize Body for Odd Shape","Body Offset for Odd Shape":"Use","Noise Reduction":"On (Using 3D+2D)"},priority:1,name:"Odd Shape 전용 모드",desc:"이형 부품. Odd Shape 모드 + 리사이즈 + 3D+2D 노이즈 리덕션으로 위치/크기 보정."},
  {symptoms:["오클루전(쉴드 캔)"],changes:{"Body Location Mode":"Full 3D (Adaptive Hei. Ths.)","Occlusion Component Check":"Use (Occlusion)","Z-Axis Move for Additional 2D Image":"Use"},priority:3,name:"Shield Can Adaptive + 오클루전 + Z축",desc:"Shield Can. Adaptive 모드 + 오클루전 체크 + Z축 이동으로 가려진 부품 검사."},
  {symptoms:["3D 무너짐"],changes:{"Body Location Mode":"Corner 3D (Fixed Hei. Ths.)","Body Offset for Odd Shape":"Use","Z-Axis Move for Additional 2D Image":"Use","AI Denoising":"On","3D Projection Switches":"Show (All Ch. On)"},priority:1,name:"3D 무너짐 기본 대응",desc:"Corner 3D 모드로 전환하고 AI Denoising 활성화. 전 채널 프로젝션으로 3D 복원 품질 향상."},
  {symptoms:["3D 무너짐"],changes:{"Body Location Mode":"Corner 3D (Fixed Hei. Ths.)","Base Setting":"Manual","Left(um)":"400","Top(um)":"400","Right(um)":"400","Bottom(um)":"400","Base ROI Alignment Mode":"Absolute","Amplitude Threshold(0-255)":"0","3D Projection Switches":"Show (All Ch. On)","Filtering":"Flat Surface"},priority:2,name:"3D 무너짐 + Base Manual 조정",desc:"Base를 Manual로 400um 확장하고 Absolute 정렬. Flat Surface 필터 적용."},
  {symptoms:["3D 무너짐"],changes:{"Body Location Mode":"Full 3D (Fixed Hei. Ths.)","3D Reconstruction in FOV":"Use (FOV)","AI Denoising":"On","Processing Speed":"x4"},priority:3,name:"3D 무너짐 + GPU 재구성",desc:"FOV 단위 GPU 기반 3D 재구성으로 전환. 넓은 영역 기준면 계산으로 안정성 향상."},
  {symptoms:["높이 부족"],changes:{"Higher Measurement":"Use (Higher)","Amplitude Threshold(0-255)":"0","Measure Range(%)":"95.0","3D Projection Switches":"Show (All Ch. On)"},priority:1,name:"높이 부족 기본 대응",desc:"Higher Measurement 활성화로 저높이 정밀도 향상. Measure Range 확대, Amplitude Threshold 0."},
  {symptoms:["높이 부족"],changes:{"Body Location Mode":"Corner 3D (Fixed Hei. Ths.)","Higher Measurement":"Use (Higher)","Base Setting":"Manual","Left(um)":"400","Top(um)":"400","Right(um)":"400","Bottom(um)":"400","Base ROI Alignment Mode":"Absolute","AI Denoising":"On"},priority:2,name:"높이 부족 + Corner 3D + Manual Base",desc:"Corner 3D + Manual Base로 기준면 안정화 후 Higher Measurement 적용."},
  {symptoms:["높이 과다"],changes:{"Filtering":"Flat Surface","Bright Threshold(Gray)":"200","Amplitude Threshold(0-255)":"3"},priority:1,name:"높이 과다 기본 대응",desc:"Flat Surface 필터로 과도한 높이 평탄화. Bright Threshold 낮춰서 포화 영역 제거."},
  {symptoms:["높이 과다"],changes:{"Filtering":"Gaussian Blur","AI Denoising":"On","Base Height Value":"Measured (Valid)"},priority:2,name:"높이 과다 + Gaussian + Measured Base",desc:"Gaussian Blur로 스파이크 스무딩. Measured Base로 실측 기준면 적용."},
  {symptoms:["높이 과다"],changes:{"3D Reconstruction in FOV":"Use (FOV)","Filtering":"Flat Surface","Visibility Threshold(0-1.0)":"0.3"},priority:3,name:"높이 과다 + FOV 재구성 + Visibility",desc:"FOV 단위 재구성으로 넓은 영역 평균화. Visibility 임계값 올려 불안정 픽셀 제거."},
  {symptoms:["베이스 불안정"],changes:{"Base Setting":"Manual","Left(um)":"400","Top(um)":"400","Right(um)":"400","Bottom(um)":"400","Base ROI Alignment Mode":"Absolute"},priority:1,name:"Base Manual 확장",desc:"Base ROI를 Manual로 상하좌우 400um 확장. Absolute 정렬로 안정화."},
  {symptoms:["베이스 불안정"],changes:{"Base Setting":"Same as Board","3D Reconstruction in FOV":"Use (FOV)"},priority:2,name:"Board Base + FOV 재구성",desc:"Board Programming의 Base Color 사용. FOV 단위 GPU 재구성으로 넓은 기준면."},
  {symptoms:["베이스 불안정"],changes:{"Base Setting":"Manual","Left(um)":"600","Top(um)":"600","Right(um)":"600","Bottom(um)":"600","Base ROI Expansion Mode":"By Keyboard","Base ROI Alignment Mode":"Absolute","Base Slope Compensation Mode":"Iterative Plane Fit"},priority:3,name:"Base 대폭 확장 + 기울기 보상",desc:"Base 600um 확장 + Iterative Plane Fit 기울기 보상. 심한 불안정 시."},
  {symptoms:["Body 노이즈"],changes:{"2D/3D Noise of Body":"Yes","Shadow Check":"High","AI Denoising":"On"},priority:1,name:"Body 노이즈 제거",desc:"2D/3D Body 노이즈 보정 + Shadow Check High + AI Denoising."},
  {symptoms:["Lead 노이즈"],changes:{"3D Noise of Lead":"Level 1"},priority:1,name:"Lead 노이즈 Level 1",desc:"Lead 영역 1차 노이즈 제거."},
  {symptoms:["Lead 노이즈"],changes:{"3D Noise of Lead":"Level 2"},priority:2,name:"Lead 노이즈 Level 2 (강력)",desc:"Level 1로 부족 시. 주의: 높이 측정값이 변경될 수 있음."},

function matchRules(selectedSymptoms) {
  if (!selectedSymptoms.length) return [];
  const sel = new Set(selectedSymptoms);
  const results = [];
  const seen = new Set();
  for (const rule of RULES) {
    const rs = new Set(rule.symptoms);
    if ([...rs].every(s => sel.has(s))) {
      const score = rs.size * 10 - rule.priority;
      if (!seen.has(rule.name)) {
        results.push({ score, rule });
        seen.add(rule.name);
      }
    }
  }
  results.sort((a, b) => b.score - a.score);
  return results.map(r => r.rule);
}

const symptomCheckboxes = {};
const partSelect = document.getElementById('partSelect');
const selCount = document.getElementById('selCount');
const resultCount = document.getElementById('resultCount');
const resultArea = document.getElementById('resultArea');
const symptomArea = document.getElementById('symptomArea');
const tabCombo = document.getElementById('tabCombo');
const tabGuide = document.getElementById('tabGuide');

PART_TYPES.forEach(([name]) => {
  const opt = document.createElement('option');
  opt.value = name;
  opt.textContent = name;
  partSelect.appendChild(opt);
});

const cats = Object.entries(SYMPTOM_CATEGORIES);
for (let i = 0; i < cats.length; i += 2) {
  const pair = document.createElement('div');
  pair.className = 'cat-pair';
  for (let col = 0; col < 2 && i + col < cats.length; col++) {
    const [cat, symptoms] = cats[i + col];
    const colDiv = document.createElement('div');
    colDiv.className = 'cat-col';
    const label = document.createElement('div');
    label.className = 'cat-label';
    label.textContent = cat;
    colDiv.appendChild(label);
    symptoms.forEach(sym => {
      const row = document.createElement('label');
      row.className = 'sym-row';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.addEventListener('change', onSymptomChange);
      symptomCheckboxes[sym] = cb;
      const sp = document.createElement('span');
      sp.textContent = sym;
      row.appendChild(cb);
      row.appendChild(sp);
      colDiv.appendChild(row);
    });
    pair.appendChild(colDiv);
  }
  symptomArea.appendChild(pair);
}

partSelect.addEventListener('change', () => {
  Object.values(symptomCheckboxes).forEach(cb => cb.checked = false);
  const pt = PART_TYPES.find(p => p[0] === partSelect.value);
  if (pt) pt[1].forEach(s => { if (symptomCheckboxes[s]) symptomCheckboxes[s].checked = true; });
  onSymptomChange();
});

document.getElementById('btnClear').addEventListener('click', () => {
  partSelect.value = PART_TYPES[0][0];
  Object.values(symptomCheckboxes).forEach(cb => cb.checked = false);
  selCount.textContent = '';
  resultCount.textContent = '';
  resultArea.innerHTML = '<div class="empty-msg">증상을 선택하세요</div>';
});

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    tabCombo.style.display = btn.dataset.tab === 'combo' ? '' : 'none';
    tabGuide.style.display = btn.dataset.tab === 'guide' ? '' : 'none';
  });
});

function onSymptomChange() {
  const selected = Object.entries(symptomCheckboxes).filter(([,cb]) => cb.checked).map(([s]) => s);
  selCount.textContent = selected.length ? `${selected.length}개 선택` : '';
  displayResults(matchRules(selected));
}

function displayResults(rules) {
  resultArea.innerHTML = '';
  if (!rules.length) {
    resultCount.textContent = '';
    resultArea.innerHTML = '<div class="empty-msg">증상을 선택하세요</div>';
    return;
  }
  resultCount.textContent = `${rules.length}개`;
  rules.forEach((rule, i) => addRuleCard(i + 1, rule));
}

function addRuleCard(rank, rule) {
  const card = document.createElement('div');
  card.className = 'rule-card';
  const badgeClass = rank <= 1 ? 'badge-1' : rank <= 2 ? 'badge-2' : 'badge-3';
  const isCrm = rule.name.includes('[CRM]');
  let changesHtml = '';
  for (const [key, val] of Object.entries(rule.changes)) {
    const def = DEFAULTS[key] || '?';
    const arrow = def !== val ? `<span class="default-val">${esc(def)}</span><span class="arrow">&gt;</span>` : '';
    changesHtml += `<div class="change-row"><span class="key">${esc(key)}</span>${arrow}<span class="new-val">${esc(val)}</span></div>`;
  }
  card.innerHTML = `
    <div class="rule-top">
      <span class="badge ${badgeClass}">#${rank}</span>
      <span class="rule-name">${esc(rule.name)}</span>
      <button class="btn-apply">적용</button>
    </div>
    <div class="rule-desc${isCrm ? ' crm' : ''}">${esc(rule.desc)}</div>
    <div class="change-box">${changesHtml}</div>
  `;
  resultArea.appendChild(card);
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function buildGuideTab() {
  const OVERVIEW = [
    ["Body Finding","부품 바디의 3D 이미지 복원 방법","Body Location Mode, Body Inspection, Extra Body Location Mode, Pad Detection, Occlusion"],
    ["3D Base Parameter","부품 주변 기준면(Base) 획득 설정","Base ROI Expansion Mode, Base Setting, Base Slope Compensation Mode"],
    ["3D Parameter","3D 복원 방법 및 필터링 설정","Base ROI Alignment Mode, Processing Speed, Higher Measurement, Filtering, 3D Reconstruction in FOV"],
    ["3D Noise Parameter","3D 노이즈 제거","Edit Noise Threshold, 3D Noise of Lead, Shadow Check, White Component, AI Denoising"]
  ];

  let html = '<div class="overview-card"><h4>Body Presetting 구조 개요</h4>';
  html += '<div class="ov-desc">Body Presetting은 AOI 장비에서 부품의 3D 형상을 복원하고 외형선을 추출하기 위한 핵심 설정입니다.</div>';
  html += '<div class="ov-table"><table><tr><th>카테고리</th><th>역할</th><th>주요 파라미터</th></tr>';
  OVERVIEW.forEach(([cat, role, params]) => {
    html += `<tr><td class="cat-cell">${esc(cat)}</td><td class="role-cell">${esc(role)}</td><td class="params-cell">${esc(params)}</td></tr>`;
  });
  html += '</table></div></div>';

  PARAM_GUIDE.forEach(([catName, params]) => {
    html += `<div class="guide-cat-title">${esc(catName)}</div>`;
    params.forEach(([paramName, options]) => {
      const desc = PARAM_GUIDE_DESC[paramName] || '';
      html += '<div class="guide-card">';
      html += `<h4>${esc(paramName)}</h4>`;
      if (desc) html += `<div class="guide-desc">${esc(desc)}</div>`;
      html += '<div class="guide-opts">';
      options.forEach(([optName, optDesc]) => {
        html += `<div class="guide-opt"><span class="opt-name">${esc(optName)}</span><span class="opt-desc">${esc(optDesc)}</span></div>`;
      });
      html += '</div></div>';
    });
  });

  tabGuide.innerHTML = html;
}

buildGuideTab();
</script>
</body>
</html>
